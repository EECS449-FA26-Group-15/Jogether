name: Jac checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Jac runtime
        run: |
          mkdir -p "$RUNNER_TEMP/jac-bin"
          curl -fL --retry 3 https://github.com/jaseci-labs/jac/releases/download/v0.37.25/jac-0.37.25-linux-x86_64 -o "$RUNNER_TEMP/jac-bin/jac"
          echo "a7d29cc7b35cc25b8697510e7d31fcb3403a11451d5693f57e0918a7420cf2c2  $RUNNER_TEMP/jac-bin/jac" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jac-bin/jac"
          echo "$RUNNER_TEMP/jac-bin" >> "$GITHUB_PATH"
      - name: Check types and formatting
        run: |
          jac check main.jac routes.jac tests/routes_tests.jac
          jac fmt --check main.jac routes.jac tests/routes_tests.jac
      - name: Run request tests and happy path
        run: |
          jac test -v
          jac run
      - name: Verify invalid CLI input exits with code 2
        shell: bash
        run: |
          set +e
          jac run main.jac --distance-km 0
          status=$?
          set -e
          test "$status" -eq 2
